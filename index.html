<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Zhafran Alghifari</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f0e8;
            color: #302c28;
            padding: 30px;
        }

        .cv {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            border: 4px solid #75695b;
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 1000px;
        }

        /* SIDEBAR */
        .sidebar {
            background: #ddd5c5;
            padding: 20px 18px;
        }

        .photo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .photo {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #5d554c;
        }

        .name-box {
            background: #75695b;
            color: white;
            text-align: center;
            padding: 9px;
            border-radius: 25px;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .profile-info {
            margin-bottom: 30px;
        }

        .profile-row {
            display: grid;
            grid-template-columns: 70px 1fr;
            margin-bottom: 14px;
            font-size: 15px;
            line-height: 1.4;
        }

        .profile-row strong {
            font-weight: normal;
        }
